<div class="task-container">
  <h1>Tasks</h1>
  <form (ngSubmit)="createTask()">
    <div>
      <label for="title">Title:</label>
      <input type="text" id="title" [(ngModel)]="newTask.title" name="title" required>
    </div>
    <div>
      <label for="description">Description:</label>
      <textarea id="description" [(ngModel)]="newTask.description" name="description" required></textarea>
    </div>
    <div>
      <label for="status">Status:</label>
      <select id="status" [(ngModel)]="newTask.status" name="status" required>
        <option value="To Do">To Do</option>
        <option value="In Progress">In Progress</option>
        <option value="Done">Done</option>
      </select>
    </div>
    <div>
      <label for="project">Project:</label>
      <input type="text" id="project" [(ngModel)]="newTask.project" name="project" required>
    </div>
    <div>
      <label for="assignee">Assignee:</label>
      <input type="text" id="assignee" [(ngModel)]="newTask.assignee" name="assignee">
    </div>
    <button type="submit">Create Task</button>
  </form>
  <div *ngFor="let task of tasks" class="task-card">
    <h2>{{ task.title }}</h2>
    <p>{{ task.description }}</p>
    <p>Status: {{ task.status }}</p>
    <button (click)="viewTask(task._id)">View Details</button>
  </div>
</div>
