<h1>{{ project?.name }}</h1>
<p>{{ project?.description }}</p>

<table class="jira-table">
  <thead>
  <tr>
    <th>Key</th>
    <th>Summary</th>
    <th>Status</th>
    <th>Assignee</th>
    <th>Due Date</th>
    <th>Priority</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let task of tasks">
    <td>{{ task._id.slice(-4).toUpperCase() }}</td>
    <td>{{ task.title }}</td>
    <td><span [ngClass]="statusClass(task.status)">{{ task.status }}</span></td>
    <td>{{ task.assignee?.nom || 'Unassigned' }}</td>
    <td>{{ task.dueDate | date:'dd MMM, yyyy' }}</td>
    <td>{{ task.priority }}</td>
  </tr>
  </tbody>
</table>
