<div class="chat-container">
  <div class="header">
    <div class="header-left">
      <div class="room-info">
        <h1 class="room-name">{{ room?.name }}</h1>
      </div>
    </div>

    <div class="header-right">
      <button (click)="connectGoogleCalendar()">Connect Google Calendar</button>

      <button class="header-icon" title="Video Call"   (click)="startVideoCall()">
        <i class="fi fi-rr-video-camera-alt"></i></button>
      <div *ngIf="!isGoogleAuthenticated" class="google-auth-notice">
      
  
      </div>
      <button class="header-icon" title="Shared Files">
        <i class="fi fi-rr-clip"></i></button>
    </div>
  </div>
  
  <div class="messages">
    <div *ngFor="let msg of messages" [ngClass]="{
      'message': true,
      'other-message': msg.sender !== currentUserId,
      'my-message': msg.sender === currentUserId
    }">

      <!-- Mode affichage -->
      <div *ngIf="editingMessageId !== msg._id" class="message-display">
        <div class="avatar" [ngClass]="{
          'my-avatar': msg.sender === currentUserId,
          'other-avatar': msg.sender !== currentUserId
        }">
          {{ (msg.SenderName || 'U').charAt(0).toUpperCase() }}
        </div>

        <div class="message-content">
          <div class="bubble">
            <strong>{{ msg.SenderName || 'Utilisateur inconnu' }}</strong> : {{ msg.content }}
            <div *ngIf="msg.file" class="file-attachment">
              <a [href]="'http://localhost:5000/uploads/' + msg.file" target="_blank" class="file-link">
                📎 Voir le fichier
              </a>
            </div>
          </div>

          <!-- Actions pour MES messages (tous les boutons) -->
          <div *ngIf="msg.sender === currentUserId" class="message-actions">
            <button class="action-btn edit-btn" (click)="startEditing(msg._id, msg.content)">
              Modifier
            </button>
            <button class="action-btn delete-btn" (click)="deleteMessage(msg._id)">
              🗑
            </button>
            <button class="action-btn like-btn" (click)="toggleLike(msg._id)">
              ❤️{{ msg.likes?.length || 0 }}
              <span *ngIf="msg.likes?.includes(currentUserId)"> (Vous)</span>
            </button>
          </div>

          <!-- Actions pour les messages des AUTRES (seulement like) -->
          <div *ngIf="msg.sender !== currentUserId" class="message-actions">
            <button class="action-btn like-btn" (click)="toggleLike(msg._id)">
              ❤️{{ msg.likes?.length || 0 }}
              <span *ngIf="msg.likes?.includes(currentUserId)"> (Vous)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Mode édition (seulement pour mes messages) -->
      <div *ngIf="editingMessageId === msg._id && msg.sender === currentUserId" class="edit-container">
        <div class="avatar" [ngClass]="{
          'my-avatar': msg.sender === currentUserId,
          'other-avatar': msg.sender !== currentUserId
        }">
          {{ (msg.SenderName || 'U').charAt(0).toUpperCase() }}
        </div>

        <div class="edit-form">
          <input [(ngModel)]="editedContent" class="edit-input" />
          <div class="edit-actions">
            <button class="save-btn" (click)="updateMessage()">Enregistrer</button>
            <button class="cancel-btn" (click)="editingMessageId = null">Annuler</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulaire pour envoyer un message -->
  <form (ngSubmit)="sendMessage()" class="send-message-form">
    <input type="text" [(ngModel)]="messageText" name="message" class="message-input"
      placeholder="Écrivez un message..." required />
    <input type="file" (change)="onFileSelected($event)" class="file-input" #fileInput />
    <button type="submit" class="send-btn">Envoyer</button>
  </form>
</div>
