<div class="sidebar" [class.collapsed]="iscollapsed">
  <div class="logo">
    <img src="assets/logo.png" alt="Logo" />

  </div>

  <nav class="nav-links">
    <a routerLink="/member" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <i class="bi bi-speedometer2"></i>
      <span *ngIf="!iscollapsed">Dashboard</span>
    </a>
    <a routerLink="/calendar" routerLinkActive="active">
      <i class="bi bi-calendar-event"></i>
      <span *ngIf="!iscollapsed">Calendar</span>
    </a>
    <a routerLink="/member/projects" routerLinkActive="active">
      <i class="bi bi-kanban"></i>
      <span *ngIf="!iscollapsed">Projects</span>
    </a>
    <a routerLink="/chat" routerLinkActive="active">
      <i class="bi bi-chat"></i>
      <span *ngIf="!iscollapsed">Collaboration</span>
    </a>
    <a routerLink="/blogs" routerLinkActive="active">
      <i class="bi bi-people-fill"></i>
      <span *ngIf="!iscollapsed">Blog</span>
    </a>
  </nav>

  <button class="sidebar-toggle" (click)="triggerToggle()">
    <i class="bi" [ngClass]="iscollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
  </button>
</div>
