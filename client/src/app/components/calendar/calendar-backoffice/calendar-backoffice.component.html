<div class="calendar-backoffice">
  <div class="header">
    <h2>Liste des événements</h2>
    <div class="actions d-flex gap-3 align-items-center">
      <div class="form-group mb-0">
        <select class="form-select form-select-sm" [(ngModel)]="selectedType" (change)="filterEventsByType()">
          <option value="">Tous les types</option>
          <option *ngFor="let type of eventTypes" [value]="type">{{ type }}</option>
        </select>
      </div>
      <button class="btn btn-primary" (click)="openAddEventModal()">
        <i class="bi bi-plus-circle"></i> Ajouter un événement
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="table table-bordered w-100">
      <thead class="table-light">
      <tr>
        <th>Titre</th>
        <th>Type</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let event of filteredEvents">
        <td>{{ event.titre }}</td>
        <td>{{ event.type }}</td>
        <td>
          <div class="btn-group" role="group">
            <button class="btn btn-info btn-sm" (click)="openEventDetails(event)">Détails</button>
            <button class="btn btn-warning btn-sm" (click)="openEditEventModal(event)">Modifier</button>
            <button class="btn btn-danger btn-sm" (click)="deleteEvent(event._id)">Supprimer</button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
