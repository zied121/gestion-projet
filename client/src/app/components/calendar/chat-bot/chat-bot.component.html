<!-- Floating Chat Button -->
<div class="fixed bottom-6 right-6 z-50 rounded-full shadow-lg transition-transform transform hover:scale-110">
  <button *ngIf="!isOpen" (click)="toggleChat()"
    class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-full p-4 shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 relative group">
    <!-- Chat Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-3.582 8-8 8a8.955 8.955 0 01-4.126-.98L3 21l1.98-5.874A8.955 8.955 0 013 12c0-4.418 3.582-8 8-8s8 3.582 8 8z" />
    </svg>

    <!-- Notification Badge -->
    <div *ngIf="hasNewMessage"
      class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center animate-pulse">
      !
    </div>

    <!-- Tooltip -->
    <div
      class="absolute bottom-full right-0 mb-2 px-3 py-1 bg-gray-900 text-white text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">
      Ask me about your events!
      <div class="absolute top-full right-4 w-2 h-2 bg-gray-900 transform rotate-45"></div>
    </div>
  </button>
</div>

<!-- Chat Dialog -->
<div *ngIf="isOpen"
  class="fixed bottom-6 right-6 z-50 w-96 h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden animate-slide-up">

  <!-- Chat Header -->
  <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-400 rounded-full border-2 border-white animate-pulse">
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-sm">AI Event Assistant</h3>
        <p class="text-xs text-white/80">Online • Ready to help</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button (click)="clearChat()" class="p-1.5 hover:bg-white/20 rounded-lg transition-colors duration-200"
        title="Clear chat">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1-1H8a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>

      <button (click)="toggleChat()" class="p-1.5 hover:bg-white/20 rounded-lg transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Messages -->
  <div #messagesContainer class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">

    <!-- Welcome Message -->
    <div *ngIf="messages.length === 0" class="text-center py-8">
      <div
        class="w-16 h-16 bg-gradient-to-r from-blue-100 to-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-3.582 8-8 8a8.955 8.955 0 01-4.126-.98L3 21l1.98-5.874A8.955 8.955 0 013 12c0-4.418 3.582-8 8-8s8 3.582 8 8z" />
        </svg>
      </div>
      <h4 class="font-medium text-gray-900 mb-2">Hello! I'm your AI assistant</h4>
      <p class="text-sm text-gray-600 mb-4">Ask me anything about your events, meetings, holidays, and schedule!</p>

      <!-- Quick Actions -->
      <div class="space-y-2">
        <button *ngFor="let suggestion of quickSuggestions" (click)="sendQuickMessage(suggestion)"
          class="block w-full text-left px-3 py-2 bg-white rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 transition-colors duration-200 text-sm">
          {{ suggestion }}
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div *ngFor="let message of messages; trackBy: trackMessage"
      [ngClass]="message.isUser ? 'flex justify-end' : 'flex justify-start'">

      <!-- User Message -->
      <div *ngIf="message.isUser" class="max-w-xs lg:max-w-md">
        <div
          class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-2xl rounded-br-md shadow-sm">
          <p class="text-sm">{{ message.content }}</p>
        </div>
        <p class="text-xs text-gray-500 mt-1 text-right">{{ formatTime(message.timestamp) }}</p>
      </div>

      <!-- AI Message -->
      <div *ngIf="!message.isUser" class="max-w-xs lg:max-w-md">
        <div class="flex items-start space-x-2">
          <div
            class="w-6 h-6 bg-gradient-to-r from-blue-100 to-purple-100 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-blue-600" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <div class="flex-1">
            <div class="bg-white border border-gray-200 px-4 py-2 rounded-2xl rounded-bl-md shadow-sm">
              <!-- Typing Animation -->
              <div *ngIf="message.isTyping" class="flex space-x-1 py-1">
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
              </div>

              <!-- Actual Message -->
              <div *ngIf="!message.isTyping" class="text-sm text-gray-800 whitespace-pre-wrap">{{ message.content }}
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-1">{{ formatTime(message.timestamp) }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="border-t border-gray-200 p-4 bg-white">
    <div class="flex items-end space-x-2">
      <div class="flex-1 relative">
        <textarea #messageInput [(ngModel)]="currentMessage" (keydown.enter)="handleKeyDown($event)"
          [disabled]="isLoading" placeholder="Ask about your events, meetings, holidays..."
          class="w-full resize-none border border-gray-300 rounded-xl px-4 py-2 pr-12 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm max-h-20 disabled:opacity-50"
          rows="1"></textarea>

        <!-- Character Counter -->
        <div *ngIf="currentMessage.length > 0" class="absolute bottom-1 right-12 text-xs text-gray-400">
          {{ currentMessage.length }}/500
        </div>
      </div>

      <button (click)="sendMessage()" [disabled]="!canSendMessage()"
        class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-400 disabled:to-gray-400 text-white p-2 rounded-xl transition-all duration-200 flex items-center justify-center disabled:cursor-not-allowed">
        <!-- Loading Spinner -->
        <svg *ngIf="isLoading" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>

        <!-- Send Icon -->
        <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>

    <!-- Quick Actions -->
    <div *ngIf="messages.length > 0" class="flex flex-wrap gap-1 mt-2">
      <button *ngFor="let suggestion of quickSuggestions.slice(0, 3)" (click)="sendQuickMessage(suggestion)"
        class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition-colors duration-200">
        {{ suggestion }}
      </button>
    </div>
  </div>
</div>
