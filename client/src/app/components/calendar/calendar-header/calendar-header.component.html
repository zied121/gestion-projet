<!-- calendar-header.component.html -->
<div class="flex justify-between items-center mb-6">
  <h5 class="text-xl font-semibold text-gray-800">{{ selectedMonthLabel }}</h5>
  <div class="flex gap-2">
    <button 
      (click)="prevPeriod()" 
      [title]="navigationButtonText.prev"
      class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <button (click)="today()" class="px-3 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-md transition">
      Today
    </button>
    <button 
      (click)="nextPeriod()" 
      [title]="navigationButtonText.next"
      class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>

<!-- En-têtes dynamiques selon la vue -->
<div *ngIf="currentView === 'month'" class="grid grid-cols-7 text-center border-b border-gray-300 mb-2">
  <div *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']"
    class="py-2 text-sm font-medium text-gray-500">
    {{ day }}
  </div>
</div>

<div *ngIf="currentView === 'week'" class="grid grid-cols-8 text-center border-b border-gray-300 mb-2">
  <div class="py-2 text-sm font-medium text-gray-500"></div> <!-- Colonne pour l'heure -->
  <div *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']"
    class="py-2 text-sm font-medium text-gray-500">
    {{ day }}
  </div>
</div>
