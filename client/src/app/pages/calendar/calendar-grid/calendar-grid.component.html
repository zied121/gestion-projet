<!-- calendar-grid.component.html -->
<div *ngFor="let week of daysInMonth" class="grid grid-cols-7 gap-px border-b border-gray-200">
    <div *ngFor="let day of week" class="min-h-[120px] p-2 border border-gray-200 flex flex-col"
      [class.bg-gray-50]="!isCurrentMonth(day)" [class.bg-indigo-50]="isToday(day)">
      <div class="flex justify-between">
        <span class="text-sm font-medium" [class.text-indigo-600]="isToday(day)"
          [class.text-gray-400]="!isCurrentMonth(day)">
          {{ day.getDate() }}
        </span>
        <button *ngIf="isCurrentMonth(day)" (click)="createEventForDay.emit(day)"
          class="text-gray-400 hover:text-gray-600 text-xs">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
              clip-rule="evenodd" />
          </svg>
        </button>
      </div>
  
      <div class="mt-1 space-y-1 overflow-y-auto max-h-20">
        <div *ngFor="let event of getEventsForDay(day)"
          class="text-xs p-1 rounded truncate flex items-center justify-between"
          [class.bg-blue-100]="event.type === 'Réunion'" [class.bg-green-100]="event.type === 'Tâche'"
          [class.bg-purple-100]="event.type === 'Deadline'" [class.bg-red-100]="event.type === 'Holiday'"
          [class.bg-indigo-100]="event.type === 'Évenement'">
          <span class="truncate">{{ event.titre }}</span>
          <div class="flex gap-1 ml-2">
            <button (click)="editEvent.emit(event); $event.stopPropagation()"
              class="text-blue-500 hover:text-blue-700 text-xs">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                <path
                  d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
              </svg>
            </button>
            <button (click)="deleteEvent.emit(event._id!); $event.stopPropagation()"
              class="text-red-500 hover:text-red-700 text-xs">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                  d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                  clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
