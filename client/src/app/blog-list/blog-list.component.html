<div class="container">
  <!-- Barre de recherche -->
  <div class="search-bar">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      placeholder="Rechercher des blogs..."
      class="search-input"
    >
  </div>

  <!-- Message de chargement -->
  <div *ngIf="isLoading" class="loading">
    Chargement en cours...
  </div>

  <!-- Message d'erreur -->
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
<!-- Liste des blogs -->
<div *ngIf="!isLoading" class="blog-grid">
  <div *ngFor="let blog of filteredBlogs()" class="blog-card">
    <h3>{{ blog.title }}</h3>
    <p>{{ blog.content | slice:0:100 }}...</p>
    <div class="actions">
      <button (click)="navigateToBlog(blog._id)">Voir</button>
      <button (click)="deleteBlog(blog._id)" class="delete">Supprimer</button>
    </div>
  </div>
</div>

  <!-- Pagination -->
  <div *ngIf="totalPages > 1" class="pagination">
    <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">
      Précédent
    </button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages">
      Suivant
    </button>
  </div>
</div>
