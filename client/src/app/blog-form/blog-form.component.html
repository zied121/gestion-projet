<div class="container mt-5">
  <div class="blog-form shadow-lg p-4 rounded">
    <h2 class="mb-4 text-center">
      {{ isEditMode ? '📝 Modifier le blog' : '🆕 Créer un nouveau blog' }}
    </h2>

    <form (ngSubmit)="onSubmit()" #blogForm="ngForm" novalidate>

      <!-- Titre -->
      <div class="mb-3">
        <label for="title" class="form-label">🖋️ Titre du blog</label>
        <input
          type="text"
          id="title"
          name="title"
          class="form-control"
          [(ngModel)]="blogData.title"
          required
          aria-required="true"
          autocomplete="off"
          [ngClass]="{'is-invalid': blogForm.submitted && !blogData.title}"
        />
        <div *ngIf="blogForm.submitted && !blogData.title" class="invalid-feedback">
          Le titre est requis.
        </div>
      </div>

      <!-- Contenu -->
      <div class="mb-3">
        <label for="content" class="form-label">🧾 Contenu</label>
        <textarea
          id="content"
          name="content"
          class="form-control"
          [(ngModel)]="blogData.content"
          required
          aria-required="true"
          rows="6"
          [ngClass]="{'is-invalid': blogForm.submitted && !blogData.content}"
        ></textarea>
        <div *ngIf="blogForm.submitted && !blogData.content" class="invalid-feedback">
          Le contenu est requis.
        </div>
      </div>

      <!-- Bouton -->
      <div class="d-flex justify-content-end">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="blogForm.invalid && blogForm.submitted"
        >
          {{ isEditMode ? '💾 Mettre à jour' : '🚀 Publier le blog' }}
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div *ngIf="errorMessage" class="alert alert-danger mt-4 text-center">
      ❌ {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success mt-4 text-center">
      ✅ {{ successMessage }}
    </div>
  </div>
</div>
