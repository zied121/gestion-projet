<section class="container mt-4">
  <!-- En-tête préservé avec styles existants -->
  <div class="row mb-4 g-3 align-items-center">
    <div class="col-md-8">
      <input 
        type="text"
        [formControl]="searchControl"
        placeholder="Rechercher des articles..."
        class="form-control"
      >
    </div>
    <div class="col-md-4">
      <select 
        [(ngModel)]="sortOption"
        (change)="onSortChange(sortOption)"
        class="form-select"
      >
        <option value="newest">Plus récent</option>
        <option value="oldest">Plus ancien</option>
        <option value="popular">Plus populaire</option>
      </select>
    </div>
  </div>

  <!-- Chargement plus discret -->
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary" style="width: 2rem; height: 2rem;"></div>
  </div>

  <!-- Liste des blogs avec ajustements mineurs -->
  <div class="row row-cols-1 row-cols-md-2 g-3">
    <div *ngFor="let blog of filteredBlogs" class="col">
      <div class="card h-100 border-light shadow-sm">
        <img *ngIf="blog.imageUrl" src="{{ blog.imageUrl }}" alt="">
        <div class="card-body">
          <div class="d-flex justify-content-between mb-2">
            <h3 class="h5 mb-0">{{ blog.title }}</h3><br>
            <small class="text-muted">{{ blog.createdAt | date:'mediumDate' }}</small>
          </div>
          <p class="card-text mt-2">{{ blog.content | slice:0:120 }}...</p>
        </div>
        <div class="card-footer bg-white border-top-0 pt-0">
          <div class="d-flex justify-content-between align-items-center">
            <a [routerLink]="['/blogs', blog._id]" class="btn btn-sm btn-outline-primary">
              Lire la suite
            </a>
            <div>
              <span class="badge bg-light text-dark me-2">
                <i class="fas fa-heart text-danger me-1"></i> {{ blog.likeCount || 0 }}
              </span>
              <span class="badge bg-light text-dark">
                <i class="fas fa-comment text-primary me-1"></i> {{ blog.comments.length || 0 }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination simplifiée -->
  <div *ngIf="totalPages > 1" class="d-flex justify-content-center mt-4">
    <nav>
      <ul class="pagination pagination-sm">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="onPageChange(currentPage - 1)">
            &laquo;
          </button>
        </li>
        <li class="page-item disabled">
          <span class="page-link">
            {{ currentPage }}/{{ totalPages }}
          </span>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="onPageChange(currentPage + 1)">
            &raquo;
          </button>
        </li>
      </ul>
    </nav>
  </div>
</section>
